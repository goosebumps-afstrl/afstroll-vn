<!-- Video dipindah ke luar pannable-layer agar resolusi 9:16-nya terjaga dan tidak melebar -->
<video id="maingame-bg-video" autoplay muted loop playsinline
    class="absolute inset-0 w-full h-full object-cover z-[-1] hidden">
    <source src="assets/videos/0002_intro03.m3u8" type="application/x-mpegURL">
</video>

<div id="pannable-layer" class="absolute z-0 transition-transform duration-300 ease-out"
    style="width: 392.06%; height: 123.08%; left: 50%; top: 50%; transform: translate(-50%, -50%);">
    <div id="background-layer" class="absolute inset-0 bg-cover bg-center"
        style="background-image: url('assets/images/apartment-day-bg.jpg');">
        <div class="overlay"></div>
    </div>

    <div id="safe-zone" class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2"
        style="width: 25.506%; height: 81.249%;">
        <div id="door-exit-area"
            class="absolute right-9 top-[45%] -translate-y-1/2 w-14 h-28 rounded-lg flex flex-col items-center justify-center cursor-pointer transition-opacity duration-300 opacity-0 hidden z-30"
            style="background: rgba(255,255,255,0.1); backdrop-filter: blur(4px);" onclick="GAME.logic.openCityMap()">
            <span class="text-2xl mb-1">🚪</span>
            <span class="text-[9px] font-bold text-center text-white drop-shadow-md">Keluar<br>Gedung</span>
        </div>

        <div id="view-city" class="w-full h-full absolute inset-0 hidden z-10">
            <button class="map-label" style="top: 25%; left: 8%;"
                onclick="GAME.logic.transitionToLocation(this, GAME.logic.enterGudangKota)">
                <span class="text-base">🏭</span> Gudang Kota
            </button>
            <button class="map-label" style="top: 35%; right: 8%;"
                onclick="GAME.logic.transitionToLocation(this, GAME.logic.enterExclusiveApt)">
                <span class="text-base">🏢</span> Apartemen Eksklusif
            </button>
            <button class="map-label" style="top: 45%; left: 8%;"
                onclick="GAME.logic.transitionToLocation(this, GAME.logic.enterMinimarket)">
                <span class="text-base">🏪</span> Minimarket
            </button>
            <button class="map-label" style="top: 58%; left: 35%; transform: translateX(-50%);"
                onclick="GAME.logic.transitionToLocation(this, GAME.logic.enterBar)">
                <span class="text-base">🍸</span> Ambrosia Room
            </button>
            <button class="map-label" style="top: 58%; left: 65%; transform: translateX(-50%);"
                onclick="GAME.logic.transitionToLocation(this, GAME.logic.enterTamanKota)">
                <span class="text-base">🌳</span> Taman Kota
            </button>
            <button class="map-label" style="top: 70%; right: 8%;"
                onclick="GAME.logic.transitionToLocation(this, GAME.logic.enterJobs)">
                <span class="text-base">💼</span> Pusat Pekerjaan
            </button>
            <button class="map-label highlight" style="bottom: 12%; left: 8%;"
                onclick="GAME.logic.transitionToLocation(this, GAME.logic.returnHome)">
                <span class="text-base">🏠</span> Ke Apartemen
            </button>
        </div>
    </div>
</div>



<div id="dynamic-content"
    class="w-full flex-1 flex flex-col justify-end items-center z-10 pb-28 relative overflow-hidden pointer-events-none">

    <div id="view-apartment" class="panel-wrapper">
        <button id="apartment-view-toggle"
            class="minimize-toggle-btn w-8 h-8 rounded-full flex items-center justify-center glass-hud hover:bg-white/20 transition-all duration-300 pointer-events-auto"
            onclick="GAME.logic.toggleApartmentView()">
            <svg id="apartment-toggle-icon" xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4 text-white transition-transform duration-500" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
        </button>
        <div class="glass-panel-main flex flex-col w-[85%] max-w-[280px]">
            <div class="glass-section-title">Ruangan</div>
            <button class="glass-button" onclick="GAME.ui.changeView('view-kasur', false)">
                <span class="glass-button-icon">🛏️</span> Kasur
            </button>
            <button class="glass-button" onclick="GAME.ui.changeView('view-kitchen', false)">
                <span class="glass-button-icon">🍳</span> Dapur & Item
            </button>
            <button class="glass-button" onclick="GAME.ui.changeView('view-bathroom', false)">
                <span class="glass-button-icon">🚿</span> Kamar Mandi
            </button>
        </div>
    </div>

    <div id="view-kasur" class="glass-panel-main hidden flex-col mb-3">
        <div class="glass-section-title">Aksi Kasur</div>
        <button class="glass-button" onclick="GAME.logic.sleep(1)">
            <span class="glass-button-icon">🥱</span>
            <div class="glass-button-content">
                <span>Tidur Sebentar</span>
                <span class="glass-button-subtext">+30% Energy, Lewati 1 Waktu</span>
            </div>
        </button>
        <button class="glass-button" onclick="GAME.logic.sleep(3)">
            <span class="glass-button-icon">😴</span>
            <div class="glass-button-content">
                <span>Tidur Panjang</span>
                <span class="glass-button-subtext">+100% Energy, Lewati 3 Waktu</span>
            </div>
        </button>
        <div class="glass-section-title mt-4">Navigasi</div>
        <button class="glass-button justify-center" onclick="GAME.ui.changeView('view-apartment', false)">
            Kembali
        </button>
    </div>

    <div id="view-kitchen" class="glass-panel-main hidden flex-col h-[65vh] w-[90%] mb-3">
        <div class="flex justify-between items-center mb-3 border-b border-white/20 pb-2 shrink-0">
            <span class="glass-section-title m-0">Kulkas & Lemari</span>
            <button class="glass-button glass-button-mini !w-auto !mb-0 px-3 py-1"
                onclick="GAME.logic.closeInventory()">Kembali</button>
        </div>

        <div id="kitchen-inventory" class="overflow-y-auto flex-1 grid grid-cols-4 gap-2 content-start pb-2"></div>

        <div id="kitchen-preview"
            class="shrink-0 h-28 bg-black/40 rounded-xl border border-white/10 shadow-inner flex items-center p-3 gap-3 hidden mt-2">
            <div class="w-20 h-20 bg-white/5 rounded-lg flex items-center justify-center shrink-0 relative">
                <span id="kitchen-preview-fallback" class="absolute text-3xl opacity-30"></span>
                <img id="kitchen-preview-img" src="" class="w-full h-full object-contain z-10 drop-shadow-md"
                    onerror="this.style.display='none'; this.previousElementSibling.classList.replace('opacity-30', 'opacity-100');">
            </div>
            <div class="flex-1 flex flex-col justify-between h-full">
                <div>
                    <div id="kitchen-preview-name" class="font-bold text-sm text-white tracking-wide"></div>
                    <div id="kitchen-preview-stats" class="text-xs text-green-300 font-medium mt-1"></div>
                </div>
                <button id="kitchen-preview-btn" class="glass-button !mb-0 highlight-blue w-24 !py-1 text-xs"
                    onclick="">Makan</button>
            </div>
        </div>
    </div>

    <div id="view-bathroom" class="glass-panel-main hidden flex-col mb-3">
        <div class="glass-section-title">Aksi Kamar Mandi</div>
        <button class="glass-button" onclick="GAME.logic.takeBath()">
            <span class="glass-button-icon">🛁</span>
            <div class="glass-button-content">
                <span>Mandi</span>
                <span class="glass-button-subtext">+10% Composure, Lewati 1 Waktu</span>
            </div>
        </button>
        <div class="glass-section-title mt-4">Navigasi</div>
        <button class="glass-button justify-center" onclick="GAME.ui.changeView('view-apartment', false)">
            Kembali
        </button>
    </div>



    <div id="view-minimarket" class="glass-panel-main hidden flex-col h-[55vh] mb-3">
        <div class="flex justify-between items-center mb-3 border-b border-white/20 pb-2">
            <span class="glass-section-title m-0">Minimarket</span>
            <button class="glass-button glass-button-mini !w-auto !mb-0 px-3 py-1"
                onclick="GAME.logic.closeMinimarket()">Kembali</button>
        </div>
        <div id="shop-list" class="overflow-y-auto flex-1 grid grid-cols-2 gap-3 pb-2 content-start"></div>
    </div>

    <div id="view-jobs" class="glass-panel-main hidden flex-col mb-3 h-[60vh] w-[85%]">
        <div class="flex justify-between items-center mb-3 border-b border-white/20 pb-2 shrink-0">
            <span class="glass-section-title m-0">Pusat Pekerjaan</span>
            <button class="glass-button glass-button-mini !w-auto !mb-0 px-3 py-1"
                onclick="GAME.ui.changeView('view-city')">Kembali</button>
        </div>

        <div class="flex-1 relative flex items-center justify-center overflow-hidden" id="job-cards-container">
            <!-- Cards will be injected by JS -->
        </div>

        <div class="shrink-0 flex justify-center gap-6 mt-4 pb-2">
            <button
                class="w-12 h-12 rounded-full bg-black/50 border border-white/10 shadow-lg text-red-500 text-2xl flex items-center justify-center active:scale-90 transition-transform"
                onclick="GAME.ui.swipeJobLeft()">✕</button>
            <button
                class="w-12 h-12 rounded-full bg-black/50 border border-white/10 shadow-lg text-green-500 text-2xl flex items-center justify-center active:scale-90 transition-transform"
                onclick="GAME.ui.swipeJobRight()">✓</button>
        </div>
    </div>

    <div id="view-story-location" class="glass-panel-main hidden flex-col text-center justify-center mb-3">
        <h2 id="story-loc-title" class="text-base font-bold mb-2">Location</h2>
        <p class="text-[10px] text-gray-300 mb-6 font-light leading-relaxed">Belum ada event NPC aktif di lokasi ini
            pada waktu sekarang.</p>
        <button class="glass-button justify-center" onclick="GAME.ui.changeView('view-city')">Kembali ke Jalan</button>
    </div>

    <div id="view-saham" class="glass-panel-main hidden flex-col h-[55vh] w-[85%] mb-3 p-0 overflow-hidden"
        style="padding: 0;">
        <div class="flex justify-between items-center bg-black/40 p-3 border-b border-white/20">
            <span class="glass-section-title m-0">LCN Exchange</span>
            <button class="glass-button glass-button-mini !w-auto !mb-0 px-3 py-1"
                onclick="GAME.logic.closeSahamApp()">Kembali</button>
        </div>
        <div id="saham-list" class="flex-1 overflow-y-auto p-3 flex flex-col gap-2"></div>
    </div>

    <div id="view-saham-detail" class="glass-panel-main hidden flex-col h-[55vh] w-[85%] mb-3 p-0 overflow-hidden"
        style="padding: 0;">
        <div class="flex justify-between items-center bg-black/40 p-2.5 border-b border-white/20">
            <span id="saham-detail-title" class="glass-section-title m-0">Detail Saham</span>
            <button class="glass-button glass-button-mini !w-auto !mb-0 px-3 py-1"
                onclick="GAME.ui.changeView('view-saham', false)">Kembali</button>
        </div>
        <div class="flex-1 overflow-y-auto p-2.5 flex flex-col gap-2">
            <div class="flex justify-between items-end border-b border-white/10 pb-1.5">
                <div>
                    <p class="text-[7px] text-gray-400 uppercase tracking-widest mb-0.5">Harga per Lembar</p>
                    <p id="saham-detail-price" class="text-lg font-bold text-white">$0</p>
                </div>
                <div class="text-right">
                    <p class="text-[7px] text-gray-400 uppercase tracking-widest mb-0.5">Dimiliki</p>
                    <p id="saham-detail-owned" class="text-[11px] font-bold text-blue-300">0 Lembar</p>
                </div>
            </div>

            <div
                class="w-full my-1 relative bg-black/40 rounded-xl border border-white/20 shadow-inner overflow-hidden">
                <div style="padding-top: 56.25%;"></div>
                <canvas id="saham-chart" class="absolute top-0 left-0 w-full h-full block"></canvas>
            </div>

            <div class="grid grid-cols-2 gap-2 text-center my-1 border-y border-white/10 py-1.5">
                <div>
                    <p class="text-[7px] text-gray-400 uppercase tracking-widest">Avg. Harga Beli</p>
                    <p id="saham-detail-avg-buy" class="text-[11px] font-bold text-white mt-0.5">$0</p>
                </div>
                <div>
                    <p class="text-[7px] text-gray-400 uppercase tracking-widest">Untung/Rugi</p>
                    <p id="saham-detail-profit" class="text-[11px] font-bold text-gray-400 mt-0.5">$0</p>
                </div>
            </div>

            <div class="flex flex-col gap-1 mt-0.5">
                <label class="text-[6px] text-gray-300 uppercase tracking-wider">Jumlah</label>
                <div class="flex gap-1.5">
                    <button
                        class="glass-button glass-button-mini !mb-0 flex-1 justify-center bg-white/5 !py-0.5 !px-1.5 !text-[9px]"
                        onclick="document.getElementById('saham-amount').value = 1">1</button>
                    <button
                        class="glass-button glass-button-mini !mb-0 flex-1 justify-center bg-white/5 !py-0.5 !px-1.5 !text-[9px]"
                        onclick="document.getElementById('saham-amount').value = 10">10</button>
                    <button
                        class="glass-button glass-button-mini !mb-0 flex-1 justify-center bg-white/5 !py-0.5 !px-1.5 !text-[9px]"
                        onclick="document.getElementById('saham-amount').value = 'MAX'">MAX</button>
                </div>
                <input type="text" id="saham-amount" class="custom-input !py-0.5 !text-[10px] mt-1" value="1"
                    placeholder="0">
            </div>

            <div class="flex gap-1.5 mt-1.5">
                <button class="glass-button highlight-blue justify-center flex-1 !mb-0 !py-0.5 !text-[10px]"
                    onclick="GAME.logic.buyStock()">BUY</button>
                <button class="glass-button highlight justify-center flex-1 !mb-0 !py-0.5 !text-[10px]"
                    onclick="GAME.logic.sellStock()">SELL</button>
            </div>
        </div>
    </div>


</div>
