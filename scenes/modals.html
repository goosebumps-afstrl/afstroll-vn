                    <button id="phone-slider-right" class="absolute right-[-8px] top-[40%] -translate-y-1/2 z-10 w-5 h-5 rounded-full bg-black/80 border border-white/30 items-center justify-center text-white text-[8px] opacity-0 group-hover:opacity-100 transition-opacity hidden" onclick="GAME.ui.scrollPhoneStats(1)">&#9654;</button>

                <div class="grid grid-cols-2 gap-2">

                    <button class="glass-button flex-col items-center text-center gap-1.5 !p-2.5 !rounded-2xl" onclick="GAME.logic.openSahamApp()">
                        <span class="text-xl m-0">📈</span> <span class="font-medium text-[9px]">Saham</span>
                    </button>
                    <button class="glass-button flex-col items-center text-center gap-1.5 !p-2.5 !rounded-2xl" onclick="GAME.logic.openMessageApp()">

                    <button class="glass-button flex-col items-center text-center gap-1.5 !p-2.5 !rounded-2xl" onclick="GAME.logic.openInventoryFromPhone()">

                    <button class="glass-button flex-col items-center text-center gap-1.5 !p-2.5 !rounded-2xl" onclick="GAME.ui.showToast('Pinjol feature in development')">
                        <span class="text-xl m-0">💸</span> <span class="font-medium text-[9px]">Pinjol</span>
                    </button>
                    <button class="glass-button flex-col items-center text-center gap-1.5 !p-2.5 !rounded-2xl" onclick="GAME.ui.showToast('Online Shop feature in development')">

                    <div class="w-6 h-1 bg-white/50 rounded-full"></div>
                </button>
            </div>

    <div id="modal-option" class="absolute inset-0 bg-black/70 z-40 hidden flex-col items-center justify-center p-4 backdrop-blur-lg">

                    <div class="flex items-center gap-3" title="Sound Effect Volume">

            </div>
