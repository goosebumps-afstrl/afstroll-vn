<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>After Strolling - Life-Sim Visual Novel</title>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

    <!-- CSS Terpisah -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="game-container">
        <!-- UI Global -->
        <div id="toast">Message</div>
        <div id="screen-fader"></div>
        <div id="error-display" style="position: absolute; top: 0; left: 0; width: 100%; z-index: 9999; background: red; color: white; padding: 20px; display: none;"></div>
        <script>
            window.addEventListener('error', function(e) {
                var d = document.getElementById('error-display');
                d.style.display = 'block';
                d.innerHTML += '<p>' + e.message + ' at ' + e.filename + ':' + e.lineno + '</p>';
            });
        </script>

        <!-- Tap to Start Overlay (Bypasses Browser Autoplay Audio Policy) -->
        <div id="tap-to-start" class="absolute inset-0 z-[100] flex flex-col items-center justify-center bg-black cursor-pointer transition-opacity duration-1000" onclick="this.style.opacity='0'; setTimeout(() => this.remove(), 1000);">
            <div class="text-white text-xl animate-pulse font-bold tracking-widest uppercase mb-4">Tap Anywhere to Start</div>
            <div class="text-gray-400 text-xs">Untuk mengaktifkan audio & musik pada game</div>
        </div>

        <!-- Wadah Scene (Akan diisi otomatis oleh JavaScript) -->
        <div id="scene-intro" class="scene active"></div>
        <div id="scene-input" class="scene"></div>
        <div id="scene-story" class="scene bg-black cursor-pointer overflow-hidden"
            onclick="GAME.logic.handleStoryTap()"></div>
        <div id="scene-maingame" class="scene" style="justify-content: flex-start;"></div>
        <div id="scene-gameover" class="scene bg-black cursor-pointer"></div>

        <!-- Global Top UI (Stats & Time/Money) -->
        <div id="global-top-ui" class="absolute top-0 left-0 right-0 bottom-0 pointer-events-none z-30 opacity-0 transition-opacity duration-1000">
            <div class="w-full p-3 flex justify-between items-start pointer-events-none">
                <div class="glass-hud flex flex-col gap-2 w-28 pointer-events-auto">
                    <div>
                        <div class="flex justify-between text-[8px] font-medium text-gray-200 mb-0.5">
                            <span>Energy</span><span class="text-yellow-400 hud-text-energy">30%</span>
                        </div>
                        <div class="hud-bar">
                            <div class="hud-fill fill-energy hud-bar-energy" style="width: 30%"></div>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between text-[8px] font-medium text-gray-200 mb-0.5">
                            <span>Hunger</span><span class="text-orange-400 hud-text-hunger">90%</span>
                        </div>
                        <div class="hud-bar">
                            <div class="hud-fill fill-hunger hud-bar-hunger" style="width: 90%"></div>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between text-[8px] font-medium text-gray-200 mb-0.5">
                            <span>Composure</span><span class="text-blue-400 hud-text-composure">75%</span>
                        </div>
                        <div class="hud-bar">
                            <div class="hud-fill fill-composure hud-bar-composure" style="width: 75%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- NEW CIRCLE HUD TOP RIGHT -->
            <div class="absolute top-[-40px] right-[-30px] w-[200px] h-[200px] rounded-full pointer-events-none flex flex-col items-end justify-center pr-20 pt-10 shadow-2xl"
                style="background: linear-gradient(135deg, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0.4) 100%); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.25); box-shadow: inset 0 2px 4px rgba(255,255,255,0.2), 0 10px 30px rgba(0,0,0,0.5); transform: scale(0.7); transform-origin: top right;">
                <div class="flex items-center gap-1 text-white mb-1.5">
                    <span class="text-xs font-light tracking-wide hud-ui-dayname">Senin</span>
                    <span class="text-xs font-light">|</span>
                    <span class="text-xs font-light tracking-wide hud-ui-daytime-day">Day 0</span>
                </div>

                <div class="w-20 h-[1px] bg-white/20 mb-1.5"></div>

                <div class="flex items-center gap-1.5 mb-2 text-right">
                    <span class="text-[10px] font-medium text-gray-200 tracking-wide hud-ui-daytime-phase">Tengah Malam</span>
                    <span class="text-sm hud-ui-daytime-icon">🌙</span>
                </div>

                <div class="flex items-center gap-1.5 text-right">
                    <span class="text-[7px] font-bold text-gray-400 tracking-widest uppercase mt-0.5">Wallet</span>
                    <span class="text-xs font-bold text-green-400 tracking-wider"><span
                            class="text-green-500/80 mr-0.5">$</span><span class="hud-ui-money">150</span></span>
                </div>
            </div>
        </div>

        <!-- Global Bottom UI (Option & Phone) -->
        <div id="global-bottom-ui" class="absolute bottom-4 left-4 right-4 flex justify-between items-end z-30 pointer-events-none opacity-0 transition-opacity duration-1000">
            <button class="glass-hud w-7 h-7 p-0 rounded-full flex items-center justify-center hover:bg-white/20 transition-transform duration-200 active:scale-95" onclick="event.stopPropagation(); GAME.ui.toggleModal('modal-option')" aria-label="Option Settings">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
            <button id="main-phone-btn" class="glass-hud w-12 h-12 p-0 rounded-full flex items-center justify-center hover:bg-white/20 transition-transform duration-200 active:scale-95" onclick="event.stopPropagation(); GAME.ui.toggleModal('modal-phone')" aria-label="Handphone App">
                <span id="phone-notif-dot" class="absolute top-0 right-0 w-3 h-3 bg-red-500 rounded-full border-2 border-black hidden shadow-[0_0_8px_rgba(239,68,68,0.8)]"></span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
                </svg>
            </button>
        </div>
        
        <!-- Wadah Modal Gabungan -->
        <div id="modals-container"></div>
    </div>

    <!-- Tag Audio tetap disini agar langsung termuat -->
    <audio id="audio-tap" src="assets/sounds/tap.mp3" preload="auto"></audio>
    <audio id="audio-bgm" src="assets/sounds/main_bgm.mp3" loop preload="auto"></audio>
    <audio id="audio-intro" src="assets/sounds/intro_story.mp3" loop preload="auto"></audio>
    <audio id="audio-voice" src="" preload="auto"></audio>

    <!-- JS Utama (Gunakan type="module" agar bisa import/export) -->
    <script type="module" src="js/main.js?v=2"></script>
</body>

</html>
